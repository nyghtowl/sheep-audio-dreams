name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      # The demos intentionally use parallel top-level module names such as
      # agents.py, so run each suite in a fresh Python process.
      - name: Test REST demo
        env:
          MOCK_MODE: "1"
        run: python -m pytest rest/tests -q

      - name: Test streaming demo
        run: python -m pytest streaming/tests -q

      - name: Lint
        run: pylint $(git ls-files '*.py')
